<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberSentinel">
  <title>CyberSentinel</title>
  <defs>
    <linearGradient id="csBrand" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!--
    "Under inspection": two brackets holding one object.

    Deliberately not a shield with an eye. That mark is worn out — Norton,
    McAfee, Avast, Bitdefender and most of the category share it — and a
    security product whose own logo is a lookalike of a known brand is not a
    good look. Brackets read as "examined" in every technical context, which
    is also a truer description of this product: it does not block things, it
    inspects them and shows the evidence.

    Purely geometric on purpose. Straight edges and one convex centre shape
    survive rasterisation at 16px, where the previous mark's eye collapsed
    into a smudge.

    Negative space is transparent, never white, so a single file works on the
    white public navbar and the #080a10 dashboard sidebar alike.
  -->
  <g fill="url(#csBrand)">
    <!-- Left bracket -->
    <path d="M25 7 H11 C8.8 7 7 8.8 7 11 V53 C7 55.2 8.8 57 11 57 H25 V48.5 H16.5 V15.5 H25 Z"/>
    <!-- Right bracket -->
    <path d="M39 7 H53 C55.2 7 57 8.8 57 11 V53 C57 55.2 55.2 57 53 57 H39 V48.5 H47.5 V15.5 H39 Z"/>
    <!-- The object under examination -->
    <path d="M32 22 L41 32 L32 42 L23 32 Z"/>
  </g>
</svg>
