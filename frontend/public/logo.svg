<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberSentinel">
  <title>CyberSentinel</title>
  <defs>
    <linearGradient id="csBrand" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!--
    Negative space is transparent, never white. This mark sits on a white
    navbar and on a #080a10 sidebar in this app; a white-filled interior
    would read as a bright blob on the dark one. Transparent lets the
    surface show through, so a single file serves both themes.

    Weights are deliberately heavier than the source render. The mark is
    displayed at 28-44px in nine places here, and thin strokes that look
    elegant at 1024px disappear entirely at 32px.
  -->
  <g fill="url(#csBrand)">
    <!-- Shield ring: outer silhouette with the interior knocked out. -->
    <path fill-rule="evenodd" d="
      M32 3.5 L58 12.5 V33 C58 46.5 46.8 56.6 32 61 C17.2 56.6 6 46.5 6 33 V12.5 Z
      M32 12.2 L50 18.4 V33 C50 41.8 42.4 48.6 32 52.3 C21.6 48.6 14 41.8 14 33 V18.4 Z
    "/>

    <!-- Eye: solid lens with the iris knocked out, so it survives small sizes
         as two clean shapes rather than three thin concentric rings. -->
    <path fill-rule="evenodd" d="
      M18.5 31.6 C24 22.6 40 22.6 45.5 31.6 C40 40.6 24 40.6 18.5 31.6 Z
      M32 26.4 A5.2 5.2 0 1 0 32 36.8 A5.2 5.2 0 1 0 32 26.4 Z
    "/>
  </g>
</svg>
