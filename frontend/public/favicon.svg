<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberSentinel">
  <title>CyberSentinel</title>
  <defs>
    <linearGradient id="csFav" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!--
    A separate drawing, not logo.svg scaled down.

    A browser tab gets ~16 device pixels. The full mark's proportions leave the
    bracket arms about one pixel thick there, which antialiasing turns to grey
    mush. This version keeps the same idea and rebalances for the size: heavier
    arms, a shorter gap, and a larger centre object, using more of the box.
  -->
  <g fill="url(#csFav)">
    <!-- Left bracket, heavier arms -->
    <path d="M25 4 H10 C6.7 4 4 6.7 4 10 V54 C4 57.3 6.7 60 10 60 H25 V49 H15 V15 H25 Z"/>
    <!-- Right bracket -->
    <path d="M39 4 H54 C57.3 4 60 6.7 60 10 V54 C60 57.3 57.3 60 54 60 H39 V49 H49 V15 H39 Z"/>
    <!-- Larger centre object -->
    <path d="M32 19 L43 32 L32 45 L21 32 Z"/>
  </g>
</svg>
