# Render blueprint for the CyberSentinel backend.
#
# The frontend deploys separately to Vercel (see frontend/vercel.json), so this
# file provisions only the API and its database — both on Render's FREE tier, so
# applying this Blueprint should not ask for payment. Redis is intentionally
# omitted (the app falls back to an in-memory channel layer); add it only when
# scaling past a single worker.
#
# Apply with: Render Dashboard → New → Blueprint → point at this repository.
#
# Secrets marked `sync: false` are NOT stored here — set them in the Render
# dashboard under Environment. Never commit real keys to this file.

services:
  - type: web
    name: cybersentinel-api
    runtime: python
    plan: free          # 100% free tier — no credit card required
    region: oregon
    rootDir: backend
    buildCommand: ./build.sh
    # Daphne, not gunicorn: the app serves WebSockets via Django Channels and a
    # WSGI server would drop every one of them.
    startCommand: daphne -b 0.0.0.0 -p $PORT cybersentinel_backend.asgi:application
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Django generates a strong value on first deploy and reuses it after.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Render injects the service hostname automatically; settings.py appends
      # it to ALLOWED_HOSTS, so this only needs a custom domain if you add one.
      - key: ALLOWED_HOSTS
        sync: false

      # The deployed Vercel URL. Drives CORS, CSRF trust, and the OAuth
      # redirect target. Example: https://cybersentinel.vercel.app
      - key: FRONTEND_URL
        sync: false

      # Set to "true" to also accept Vercel's per-branch preview subdomains.
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: cybersentinel-db
          property: connectionString

      # No REDIS_URL: the free tier runs a single worker, so the in-memory
      # channel layer handles live WebSocket push fine (settings.py falls back
      # automatically). Add a Redis service and this key only if you scale to
      # multiple workers and need broadcasts to reach all of them.

      - key: LOG_LEVEL
        value: INFO

      # ── Secrets: set these in the Render dashboard ───────────────────────
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # Microsoft Entra ID sign-in. Unset, the Microsoft button stays hidden.
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: IPQS_API_KEY
        sync: false

databases:
  - name: cybersentinel-db
    plan: free            # Free Postgres (Render deletes it after 30 days —
                          # upgrade to a paid plan before then to keep the data)
    region: oregon
    postgresMajorVersion: "16"
